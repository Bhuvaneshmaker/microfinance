services:
  - type: web
    name: microfinance-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run prisma:migrate:deploy && npm run prisma:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://microfinanceapplive.netlify.app
      - key: DATABASE_URL
        fromDatabase:
          name: microfinance-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: microfinance-postgres
    plan: free
    region: singapore
    databaseName: microfinance
    user: microfinance
